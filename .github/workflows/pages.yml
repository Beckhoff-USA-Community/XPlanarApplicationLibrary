name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the site
        run: |
          pip install zensical==0.0.52
          zensical build --clean --strict -f zensical.toml
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # On a branch or pull request the built site is also attached as a
      # plain artifact for review. Download it and open index.html locally.
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site

  # Publishing needs GitHub Pages enabled for the repository with the
  # GitHub Actions source. Flip the Pages source in the repository
  # settings before the first run.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
