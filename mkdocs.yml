site_name: XPlanar Application Library
site_description: A TwinCAT PLC library that provides a consistent and flexible starting point for XPlanar applications
site_url: https://beckhoff-usa-community.github.io/XPlanarApplicationLibrary/
repo_url: https://github.com/Beckhoff-USA-Community/XPlanarApplicationLibrary

theme:
  name: material
  language: en
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Installation: installation.md
  - Function Blocks: functionblocks.md
  - Interfaces: interfaces.md
  - Globals: globals.md
  - Changelog: changelog.md
  - Releasing: releasing.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
